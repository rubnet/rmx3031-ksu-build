name: Build KernelSU-Next LKM for RMX3031

# 手动触发 (Actions 页面 → Run workflow) 或 push 自动触发
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout this repo (contains device.config)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential bc flex bison libssl-dev libncurses-dev \
            gcc-aarch64-linux-gnu xz-utils wget git python3 openssl cpio
          # kernel Makefile expects `python`
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          echo "=== toolchain ==="
          aarch64-linux-gnu-gcc --version | head -1
          clang --version 2>/dev/null | head -1 || true

      - name: Clone kernel source (nishant6342 R, 4.14.300 -> patch to 4.14.186+)
        run: |
          git clone --depth 1 --branch R https://github.com/nishant6342/kernel_realme_RMX3031.git kernel_src
          cd kernel_src
          echo "PATCHLEVEL before: $(grep '^PATCHLEVEL' Makefile | awk '{print $3}')"
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 186/' Makefile
          sed -i 's/^EXTRAVERSION = .*/EXTRAVERSION = +/' Makefile
          echo "vermagic target: $(grep '^VERSION' Makefile | awk '{print $3}').$(grep '^PATCHLEVEL' Makefile | awk '{print $3}').$(grep '^SUBLEVEL' Makefile | awk '{print $3}')$(grep '^EXTRAVERSION' Makefile | awk '{print $3}')"
          # clean any stale build artifacts from clone (avoid "dirty kernel" issues)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- mrproper 2>/dev/null || true
          # re-apply vermagic patch (mrproper may have touched generated files only, Makefile stays)
          echo "Makefile after mrproper: $(grep '^SUBLEVEL' Makefile) $(grep '^EXTRAVERSION' Makefile)"

      - name: Clone KernelSU-Next (legacy branch for non-GKI 4.14)
        run: |
          git clone --depth 1 --branch legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          echo "KSU-Next commit: $(cd KernelSU-Next && git rev-parse HEAD)"

      - name: Prepare kernel config + modules_prepare
        run: |
          mkdir -p build
          cp device.config kernel_src/.config
          # ★ 关键: 设备 config 里 CROSS_COMPILE="aarch64-linux-android-" 指向不存在的工具链
          #   改成 Actions 安装的 aarch64-linux-gnu-, 否则 olddefconfig/prepare 找 android-gcc 失败
          sed -i 's|^CONFIG_CROSS_COMPILE=.*|CONFIG_CROSS_COMPILE="aarch64-linux-gnu-"|' kernel_src/.config
          cd kernel_src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=../build olddefconfig 2>&1 | tail -5
          rm -f include/generated/utsrelease.h include/config/kernel.release
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=../build modules_prepare 2>&1 | tail -10
          echo "kernel.release = $(cat ../build/include/config/kernel.release 2>/dev/null)"

      - name: Apply 4.14 compat shim
        run: |
          KSU=KernelSU-Next/kernel
          mkdir -p "$KSU/shim"
          cat > "$KSU/shim/compat_414_extra.h" <<'SHIM'
          #ifndef __GHOSTLOCK_COMPAT_414_EXTRA_H__
          #define __GHOSTLOCK_COMPAT_414_EXTRA_H__
          #include <linux/version.h>
          #if LINUX_VERSION_CODE < KERNEL_VERSION(4, 16, 0)
          #ifndef copy_to_kernel_nofault
          #define copy_to_kernel_nofault(dst, src, len) probe_kernel_write((dst), (src), (len))
          #endif
          #ifndef copy_from_kernel_nofault
          #define copy_from_kernel_nofault(dst, src, len) probe_kernel_read((dst), (src), (len))
          #endif
          #endif
          #endif
          SHIM
          echo "KCFLAGS=-include $(pwd)/$KSU/shim/compat_414_extra.h" >> $GITHUB_ENV

      - name: Build kernelsu.ko
        run: |
          cd kernel_src
          # ★ 决定性: KernelSU-Next 必须有 hook 模式否则 Kbuild:221 报错。
          #   设备无 CONFIG_KPROBES -> 不能用 kprobe; 不改内核源码 -> 用 SYSCALL_TABLE_HOOK
          #   (模块自带 patch_memory.o + symbol_resolver.o, 靠 kallsyms_lookup_name 找表, 4.14 仍导出)
          make -k -j$(nproc) ARCH=arm64 O=../build M=../KernelSU-Next/kernel \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CONFIG_KSU=m CONFIG_KSU_SYSCALL_TABLE_HOOK=y \
            CONFIG_KSU_DISABLE_MANAGER=y CONFIG_KSU_DISABLE_POLICY=y \
            KSU_GIT_VERSION_VALID=1 KSU_GIT_VERSION=2 \
            modules 2>&1 | tee ../ksu_build.log
          KO=$(find ../KernelSU-Next/kernel -name 'kernelsu.ko' | head -1)
          [ -n "$KO" ] || { echo "!! kernelsu.ko NOT built"; tail -40 ../ksu_build.log; exit 2; }
          cp "$KO" ../kernelsu_rmx3031.unsigned.ko
          echo "Built: $(ls -la ../kernelsu_rmx3031.unsigned.ko)"

      - name: Generate self-signed cert + sign module
        run: |
          # 自签密钥 (SHA512, 匹配设备 CONFIG_MODULE_SIG_SHA512)
          openssl req -new -x509 -newkey rsa:2048 -nodes \
            -keyout signing_key.pem -out signing_cert.pem \
            -days 3650 -subj "/CN=GhostLock-RMX3031" 2>/dev/null
          openssl x509 -in signing_cert.pem -outform DER -out ghost_rmx3031.crt.der
          # 自包含签名脚本 (不依赖内核 sign-file 工具, 账本 ZM1/ZK6 验证过的格式)
          python3 sign_module.py kernelsu_rmx3031.unsigned.ko \
            signing_cert.pem signing_key.pem kernelsu_rmx3031.ko
          echo "=== signed module ==="
          ls -la kernelsu_rmx3031.ko ghost_rmx3031.crt.der
          md5sum kernelsu_rmx3031.ko ghost_rmx3031.crt.der
          # 验证签名结构
          python3 -c "
          d=open('kernelsu_rmx3031.ko','rb').read()
          print('marker at end:', d[-28:])
          import struct
          ms=struct.unpack('>BBBBBBBBI', d[-40:-28])
          print('module_signature:', ms, 'sig_len=', ms[8])
          "

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ksu_build.log
            sign_build.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-rmx3031
          path: |
            kernelsu_rmx3031.ko
            ghost_rmx3031.crt.der
            signing_cert.pem
          retention-days: 30
